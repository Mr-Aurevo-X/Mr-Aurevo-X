name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Mr-Aurevo-X
          # PAT sees private contribs on the grid; falls back to GITHUB_TOKEN.
          github_token: ${{ secrets.STATS_GH_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bust GitHub Camo cache — profile embeds raw SVG from the output branch.
      - name: Checkout main for README cache-bust
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Update snake cache-bust in README
        working-directory: main-repo
        run: |
          set -euo pipefail
          V="${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Match absolute raw snake URLs with or without an existing ?v=.
          sed -i -E \
            "s#(https://raw\\.githubusercontent\\.com/Mr-Aurevo-X/Mr-Aurevo-X/output/github-contribution-grid-snake(-dark)?\\.svg)(\\?v=[A-Za-z0-9]+)?#\\1?v=${V}#g" \
            README.md
          git add README.md
          if git diff --staged --quiet; then
            echo "Snake cache-bust already current."
            exit 0
          fi
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore: bust snake Camo cache [skip ci]"
          git push

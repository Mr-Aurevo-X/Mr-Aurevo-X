<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="100" viewBox="0 0 1100 100" role="img" aria-label="Workshop commit pulse">
  <rect width="1100" height="100" rx="12" fill="#050807" stroke="#1f4d32"/>
  <circle cx="28" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="4" fill="#27c93f"/>
  <text x="80" y="26" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">git@workshop -- last pulse</text>

  <!-- soft glow bar -->
  <rect x="24" y="48" width="1052" height="36" rx="8" fill="#0a1a12" stroke="#123222">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="52" cy="66" r="5" fill="#39ff14">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <text x="72" y="71" fill="#39ff14" font-family="Consolas, monospace" font-size="15">
    main · +142 -18 · sync OK
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <text x="520" y="71" fill="#00f0ff" font-family="Consolas, monospace" font-size="13" opacity="0.9">
    atelier · salon · lab · vitrine
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <text x="920" y="71" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">
    clean tree
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="540" height="280" viewBox="0 0 540 280" role="img" aria-label="Cursor AI build console">
  <defs>
    <clipPath id="c"><rect x="16" y="40" width="508" height="220" rx="4"/></clipPath>
    <pattern id="s" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#39ff14" opacity="0.05"/>
    </pattern>
    <clipPath id="b0"><rect x="28" y="-14" height="18" width="0"><animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.00;0.06;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b1"><rect x="28" y="4" height="18" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.06;0.12;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b2"><rect x="28" y="22" height="18" width="0"><animate attributeName="width" values="0;0;320;320;0" keyTimes="0;0.12;0.18;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b3"><rect x="28" y="40" height="18" width="0"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.18;0.24;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b4"><rect x="28" y="58" height="18" width="0"><animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.24;0.30;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b5"><rect x="28" y="76" height="18" width="0"><animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.30;0.36;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b6"><rect x="28" y="94" height="18" width="0"><animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.36;0.42;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b7"><rect x="28" y="112" height="18" width="0"><animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.42;0.48;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b8"><rect x="28" y="130" height="18" width="0"><animate attributeName="width" values="0;0;260;260;0" keyTimes="0;0.48;0.54;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b9"><rect x="28" y="148" height="18" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.54;0.60;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b10"><rect x="28" y="166" height="18" width="0"><animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.60;0.64;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b11"><rect x="28" y="184" height="18" width="0"><animate attributeName="width" values="0;0;320;320;0" keyTimes="0;0.64;0.72;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="b12"><rect x="28" y="202" height="18" width="0"><animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.72;0.78;0.88;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="540" height="280" rx="12" fill="#050807" stroke="#1f4d32"/>
  <circle cx="28" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="4" fill="#27c93f"/>
  <text x="80" y="26" fill="#39ff14" font-family="Consolas, monospace" font-size="12">cursor@ai -- build_session</text>
  <rect x="16" y="40" width="508" height="220" rx="4" fill="#020403"/>
  <rect x="16" y="40" width="508" height="220" rx="4" fill="url(#s)"/>
  <g clip-path="url(#c)" font-family="Consolas, monospace" font-size="12" fill="#39ff14">
    <g>
      <text x="28" y="0" clip-path="url(#b0)">$ cursor compile host/ --release</text>
      <text x="28" y="18" fill="#00f0ff" clip-path="url(#b1)">compiling WinCleaner ... done</text>
      <text x="28" y="36" fill="#00f0ff" clip-path="url(#b2)">compiling DiskMap ... done</text>
      <text x="28" y="54" fill="#00f0ff" clip-path="url(#b3)">compiling Trad-X ... done</text>
      <text x="28" y="72" clip-path="url(#b4)">$ refactor ui/vendor/pc-command-kit</text>
      <text x="28" y="90" fill="#9dffc2" clip-path="url(#b5)">patched 14 modules | synced SoT</text>
      <text x="28" y="108" clip-path="url(#b6)">$ git push origin HEAD</text>
      <text x="28" y="126" fill="#00f0ff" clip-path="url(#b7)">84 private | 2 public | clean tree</text>
      <text x="28" y="144" clip-path="url(#b8)">$ ship --await human-qa</text>
      <text x="28" y="162" fill="#6aff9a" clip-path="url(#b9)">queued | stress-test on real PC</text>
      <text x="28" y="180" clip-path="url(#b10)">$ status</text>
      <text x="28" y="198" fill="#39ff14" clip-path="url(#b11)">BUILD_OK | waiting signature</text>
      <text x="28" y="216" fill="#00f0ff" clip-path="url(#b12)">cursor@<tspan fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="0.75s" begin="8.5s" repeatCount="indefinite"/>_</tspan></text>
      <animateTransform attributeName="transform" type="translate" values="0 40;0 -120;0 40" keyTimes="0;0.85;1" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

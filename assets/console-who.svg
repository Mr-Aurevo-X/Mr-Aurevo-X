<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="Workshop session chat: human detailed prompts, AI works, asks confirm, ships">
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#39ff14" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1100" height="440" rx="12" fill="#050807" stroke="#1f4d32"/>
  <circle cx="28" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="4" fill="#27c93f"/>
  <text x="80" y="26" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">session@workshop -- live thread (simulated)</text>
  <text x="820" y="26" fill="#00f0ff" font-family="Consolas, monospace" font-size="12">PROMPT | WORK | CONFIRM | SHIP</text>

  <rect x="16" y="40" width="1068" height="380" rx="8" fill="#020403" stroke="#123222"/>
  <rect x="16" y="40" width="1068" height="380" rx="8" fill="url(#scan)"/>

  <!-- 96s loop: A 0-32 | B 32-64 | C 64-96. No scene labels. No sticky prompt. -->
  <g font-family="Consolas, monospace" font-size="13">

    <!-- SCENE A: WinCleaner -->
    <text x="36" y="70" fill="#00f0ff">
      human&gt; Add a Traces tab to WinCleaner.
      <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.01;0.32;0.333;0.34;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="92" fill="#7ec8ff">
      List Recent / JumpLists / ExplorerHistory. Clear only with ConfirmGate.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.04;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="114" fill="#7ec8ff">
      No exe rebuild. Keep Lancer.cmd. Ship only after my green light.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.07;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="146" fill="#39ff14">
      cursor&gt; Got it. Plan: modules/Traces.ps1 + API listTraces/clearTraces.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.10;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="168" fill="#9dffc2">
      Wiring ConfirmGate on destructive clears. Working now...
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.13;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="190" fill="#9dffc2">
      [work] UI tab + PowerShell module + API hooks done.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.17;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="212" fill="#ffb86c">
      Confirm: run empty-folder edge-case QA on your PC?
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.20;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="244" fill="#00f0ff">
      human&gt; Yes. Also break icon-cache race on Win11, then retest.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="276" fill="#39ff14">
      cursor&gt; Patched race. Retest path ready.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="298" fill="#ffb86c">
      Awaiting go / no-go to commit + push.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="330" fill="#00f0ff">
      human&gt; GREEN LIGHT -- ship.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.30;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="362" fill="#39ff14">
      cursor&gt; Pushed. Tree clean. Next idea when you are ready.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.305;0.31;0.32;0.333;1" dur="96s" repeatCount="indefinite"/>
    </text>

    <!-- SCENE B: QrMake -->
    <text x="36" y="70" fill="#00f0ff">
      human&gt; Ship Wi-Fi + vCard payloads in QrMake. Local PNG export only.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="92" fill="#7ec8ff">
      Keep bat/pythonw launch. No telemetry. Say updates are not guaranteed.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.38;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="114" fill="#7ec8ff">
      Add release asset. Do not touch private Suite / Atelier repos.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.41;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="146" fill="#39ff14">
      cursor&gt; Scope locked to Git Vitrine Public/QrMake only.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.44;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="168" fill="#9dffc2">
      Implementing encoders + preview pane. Hold on...
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.47;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="190" fill="#9dffc2">
      [work] Wi-Fi / vCard / export OK. README + release notes drafted.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="212" fill="#ffb86c">
      Confirm: publish GitHub release tag now?
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.54;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="244" fill="#00f0ff">
      human&gt; Tag it. Then I smoke-test QR with phone camera.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.57;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="276" fill="#39ff14">
      cursor&gt; Release published. Smoke checklist ready for you.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.60;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="298" fill="#ffb86c">
      Need your camera QA before we call it done.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.61;0.62;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="330" fill="#00f0ff">
      human&gt; Scanned OK on Android + iOS. SHIP.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.63;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="362" fill="#39ff14">
      cursor&gt; Marked stable. Vitrine updated. Awaiting next brief.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.64;0.65;0.66;1" dur="96s" repeatCount="indefinite"/>
    </text>

    <!-- SCENE C: Lab -->
    <text x="36" y="70" fill="#00f0ff">
      human&gt; Lab tool: reset machine fingerprint on disposable VM.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.67;0.68;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="92" fill="#7ec8ff">
      MAC + MachineGuid/HWID + volume serial. Dry-run first. Hard block on host.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.71;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="114" fill="#7ec8ff">
      Separate from Auto-Dox. Keep Lab blurbs accurate and distinct.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.73;0.74;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="146" fill="#39ff14">
      cursor&gt; Affirmative. Guardrails: VM detect + ConfirmGate.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.77;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="168" fill="#9dffc2">
      Building dry-run report + apply path. Working...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.80;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="190" fill="#9dffc2">
      [work] Dry-run shows 4 markers. Host outside VM returns DENY.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.84;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="212" fill="#ffb86c">
      Confirm: enable Apply behind double ConfirmGate?
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.87;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="244" fill="#00f0ff">
      human&gt; Yes, double gate. I will break it on a Hyper-V snapshot.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.89;0.90;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="276" fill="#39ff14">
      cursor&gt; Double gate live. Snapshot retest checklist ready.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.92;0.93;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="298" fill="#ffb86c">
      Go / no-go after your VM break-test?
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.94;0.945;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="330" fill="#00f0ff">
      human&gt; Broke restore once -- you fixed it. GREEN -- ship Lab only.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.955;0.96;1" dur="96s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="362" fill="#39ff14">
      cursor&gt; Lab commit pushed. Suite untouched. Ready for next prompt.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.97;0.975;1" dur="96s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="36" y="415" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">simulated crafted sessions -- not live chat | detailed human prompts · AI work · confirm · ship</text>
</svg>

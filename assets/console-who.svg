<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-label="Who runs this workshop dialogue">
  <defs>
    <pattern id="ws" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#39ff14" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1100" height="260" rx="12" fill="#050807" stroke="#1f4d32"/>
  <circle cx="28" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="4" fill="#27c93f"/>
  <text x="80" y="26" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">who@workshop -- operators</text>
  <text x="900" y="26" fill="#00f0ff" font-family="Consolas, monospace" font-size="12">AI + HUMAN</text>

  <!-- left pane Cursor -->
  <rect x="16" y="40" width="520" height="200" rx="8" fill="#020403" stroke="#1f4d32"/>
  <rect x="16" y="40" width="520" height="200" rx="8" fill="url(#ws)"/>
  <text x="36" y="68" fill="#39ff14" font-family="Consolas, monospace" font-size="13">cursor_ai</text>
  <rect x="36" y="84" width="460" height="72" rx="10" fill="#0a1a12" stroke="#39ff14" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.08;0.12;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="112" fill="#39ff14" font-family="Consolas, monospace" font-size="13" opacity="0">I scaffold, refactor, ship.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.12;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>
  <text x="56" y="136" fill="#9dffc2" font-family="Consolas, monospace" font-size="13" opacity="0">Awaiting your go / no-go.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.22;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>
  <text x="36" y="190" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">BUILDS · CODE · TOOLING</text>
  <text x="36" y="220" fill="#39ff14" font-family="Consolas, monospace" font-size="12" opacity="0">cursor@ai:~$ <tspan fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="8s" repeatCount="indefinite"/>_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.28;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>

  <!-- right pane Human -->
  <rect x="564" y="40" width="520" height="200" rx="8" fill="#020403" stroke="#1a4a55"/>
  <text x="584" y="68" fill="#00f0ff" font-family="Consolas, monospace" font-size="13">mr_aurevo_x</text>
  <rect x="584" y="84" width="460" height="72" rx="10" fill="#0a1820" stroke="#00f0ff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.38;0.42;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="604" y="112" fill="#00f0ff" font-family="Consolas, monospace" font-size="13" opacity="0">Idea in. Break it. Retest.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.42;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>
  <text x="604" y="136" fill="#9dffc2" font-family="Consolas, monospace" font-size="13" opacity="0">GREEN LIGHT -- ship it.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.52;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>
  <text x="584" y="190" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">IDEAS · QA · VISION</text>
  <text x="584" y="220" fill="#00f0ff" font-family="Consolas, monospace" font-size="12" opacity="0">human@:~$ <tspan fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="16s" repeatCount="indefinite"/>_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.58;0.92;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/>
  </text>
</svg>

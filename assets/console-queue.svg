<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Workshop build queue">
  <defs>
    <pattern id="qs" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#39ff14" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1100" height="220" rx="12" fill="#050807" stroke="#1f4d32"/>
  <circle cx="28" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="4" fill="#27c93f"/>
  <text x="80" y="26" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">queue@workshop -- build pipeline</text>
  <text x="940" y="26" fill="#00f0ff" font-family="Consolas, monospace" font-size="12">ACTIVE</text>
  <rect x="16" y="40" width="1068" height="160" rx="4" fill="#020403"/>
  <rect x="16" y="40" width="1068" height="160" rx="4" fill="url(#qs)"/>

  <!-- col headers -->
  <text x="40" y="68" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">TOOL</text>
  <text x="320" y="68" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">STAGE</text>
  <text x="520" y="68" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">NOTE</text>

  <!-- row 0 QrMake -->
  <text x="40" y="100" fill="#39ff14" font-family="Consolas, monospace" font-size="14">QrMake</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="320" y="100" fill="#39ff14" opacity="1">BUILD
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="100" fill="#00f0ff" opacity="0">QA
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="100" fill="#6aff9a" opacity="0">SHIP
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="520" y="100" fill="#9dffc2" font-family="Consolas, monospace" font-size="13">multi-payload QR · public vitrine</text>

  <!-- row 1 WinCleaner -->
  <text x="40" y="130" fill="#39ff14" font-family="Consolas, monospace" font-size="14">WinCleaner</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="320" y="130" fill="#00f0ff" opacity="1">QA
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="2s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="130" fill="#6aff9a" opacity="0">SHIP
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="2s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="130" fill="#39ff14" opacity="0">BUILD
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="2s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="520" y="130" fill="#9dffc2" font-family="Consolas, monospace" font-size="13">traces · jump lists · human signoff</text>

  <!-- row 2 DiskMap -->
  <text x="40" y="160" fill="#39ff14" font-family="Consolas, monospace" font-size="14">DiskMap</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="320" y="160" fill="#6aff9a" opacity="1">SHIP
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="4s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="160" fill="#39ff14" opacity="0">BUILD
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="4s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="160" fill="#00f0ff" opacity="0">QA
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.28;0.33;0.61;0.66;1" dur="24s" begin="4s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="520" y="160" fill="#9dffc2" font-family="Consolas, monospace" font-size="13">volume map · atelier private</text>

  <!-- row 3 FastFind / ColorPicker / DeviseConvert rotating label -->
  <g font-family="Consolas, monospace" font-size="14" fill="#39ff14">
    <text x="40" y="190" opacity="1">FastFind
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="40" y="190" opacity="0">ColorPicker
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="40" y="190" opacity="0">DeviseConvert
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="320" y="190" fill="#39ff14" opacity="1">BUILD
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" begin="1s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="190" fill="#00f0ff" opacity="0">QA
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" begin="1s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="320" y="190" fill="#6aff9a" opacity="0">SHIP
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.30;0.35;0.63;0.68;1" dur="24s" begin="1s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="520" y="190" fill="#9dffc2" font-family="Consolas, monospace" font-size="13">next in queue · slow rotate</text>
</svg>

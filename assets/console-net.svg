<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160" role="img" aria-label="Network telemetry console ticker">
  <defs>
    <clipPath id="t"><rect x="20" y="44" width="1060" height="96" rx="4"/></clipPath>
  </defs>
  <rect width="1100" height="160" rx="12" fill="#050807" stroke="#1f4d32"/>
  <text x="28" y="28" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">tcpdump@workshop -- live_feed (simulated)</text>
  <rect x="20" y="44" width="1060" height="96" rx="4" fill="#020403"/>
  <g clip-path="url(#t)" font-family="Consolas, monospace" font-size="13">
    <text y="70" fill="#39ff14">
      <tspan x="1100">14:32:01 atelier | github push OK | 14:32:08 lab IdentityReset dry-run | 14:32:15 salon launch Incremental-X | 14:32:22 qrmake export wifi.png | 14:32:30 telemetry refresh private | 14:32:41 human QA GREEN | 14:32:55 cursor idle -- awaiting idea | </tspan>
      <animate attributeName="x" from="1100" to="-2200" dur="18s" repeatCount="indefinite"/>
    </text>
    <text y="100" fill="#00f0ff">
      <tspan x="0">SYN atelier:443 | ACK lab:22 | PSH salon:8080 | FIN vitrine:public | RST divers:denied | KEEP-ALIVE qa:human | </tspan>
      <animate attributeName="x" from="0" to="-1800" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="20" y="140" width="200" height="6" rx="3" fill="#123222"/>
  <rect x="20" y="140" width="80" height="6" rx="3" fill="#39ff14">
    <animate attributeName="width" values="40;180;60;200;40" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160" role="img" aria-label="Network telemetry console ticker">
  <defs>
    <clipPath id="t"><rect x="20" y="44" width="1060" height="96" rx="4"/></clipPath>
    <!-- Full-width typewriter on status line; ~32s cycle -->
    <clipPath id="n0"><rect x="28" y="56" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.00;0.10;0.94;1" dur="32s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="n1"><rect x="28" y="56" height="20" width="0"><animate attributeName="width" values="0;0;440;440;0" keyTimes="0;0.10;0.22;0.94;1" dur="32s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="n2"><rect x="28" y="56" height="20" width="0"><animate attributeName="width" values="0;0;700;700;0" keyTimes="0;0.22;0.36;0.94;1" dur="32s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="n3"><rect x="28" y="56" height="20" width="0"><animate attributeName="width" values="0;0;940;940;0" keyTimes="0;0.36;0.52;0.94;1" dur="32s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="n4"><rect x="28" y="56" height="20" width="0"><animate attributeName="width" values="0;0;1040;1040;0" keyTimes="0;0.52;0.70;0.94;1" dur="32s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1100" height="160" rx="12" fill="#050807" stroke="#1f4d32"/>
  <text x="28" y="28" fill="#6aff9a" font-family="Consolas, monospace" font-size="12">tcpdump@workshop -- live_feed (simulated)</text>
  <rect x="20" y="44" width="1060" height="96" rx="4" fill="#020403"/>
  <g clip-path="url(#t)" font-family="Consolas, monospace" font-size="13">
    <text y="70" fill="#39ff14">
      <tspan x="1100">14:32:01 atelier | github push OK | 14:32:08 lab IdentityReset dry-run | 14:32:15 salon launch Incremental-X | 14:32:22 qrmake export wifi.png | 14:32:30 deviseconvert BCE refresh | 14:32:38 metast rip EXIF batch | 14:32:45 telemetry refresh private | 14:32:52 human QA GREEN | 14:33:05 cursor idle -- awaiting idea | 14:33:18 vitrine UnitConvert ship | </tspan>
      <animate attributeName="x" from="1100" to="-3200" dur="36s" repeatCount="indefinite"/>
    </text>
    <g>
      <text x="28" y="100" fill="#123222">SYN atelier:443 | ACK lab:22 | PSH salon:8080 | FIN vitrine:public | RST divers:denied | KEEP-ALIVE qa:human |</text>
      <text x="28" y="100" fill="#00f0ff" clip-path="url(#n0)">SYN atelier:443 | </text>
      <text x="28" y="100" fill="#00f0ff" clip-path="url(#n1)">SYN atelier:443 | ACK lab:22 | </text>
      <text x="28" y="100" fill="#00f0ff" clip-path="url(#n2)">SYN atelier:443 | ACK lab:22 | PSH salon:8080 | </text>
      <text x="28" y="100" fill="#00f0ff" clip-path="url(#n3)">SYN atelier:443 | ACK lab:22 | PSH salon:8080 | FIN vitrine:public | </text>
      <text x="28" y="100" fill="#00f0ff" clip-path="url(#n4)">SYN atelier:443 | ACK lab:22 | PSH salon:8080 | FIN vitrine:public | RST divers:denied | KEEP-ALIVE qa:human | <tspan fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="0.85s" begin="22s" repeatCount="indefinite"/>_</tspan></text>
    </g>
  </g>
  <rect x="20" y="140" width="200" height="6" rx="3" fill="#123222"/>
  <rect x="20" y="140" width="80" height="6" rx="3" fill="#39ff14">

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Mr-Aurevo-X workshop boot console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030605"/>
      <stop offset="100%" stop-color="#07140f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="24" y="48" width="1052" height="248" rx="6"/>
    </clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff14" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" fill="url(#bg)"/>
  <rect x="12" y="12" width="1076" height="296" rx="14" fill="#050807" stroke="#1a3d2a" stroke-width="2"/>
  <circle cx="40" cy="32" r="5" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="5" fill="#ffbd2e"/>
  <circle cx="76" cy="32" r="5" fill="#27c93f"/>
  <text x="100" y="37" fill="#6aff9a" font-family="Consolas, ui-monospace, monospace" font-size="13">root@mr-aurevo-x -- boot · workshop_kernel</text>
  <text x="980" y="37" fill="#00f0ff" font-family="Consolas, ui-monospace, monospace" font-size="12">ONLINE</text>

  <rect x="24" y="48" width="1052" height="248" rx="6" fill="#020403" stroke="#123222"/>
  <rect x="24" y="48" width="1052" height="248" rx="6" fill="url(#scan)"/>

  <g clip-path="url(#screen)" font-family="Consolas, ui-monospace, monospace" font-size="14">
    <g>
      <text x="40" y="0" fill="#39ff14" opacity="0">[  OK  ] mount /atelier          PC Command hub
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="22" fill="#39ff14" opacity="0">[  OK  ] mount /salon            Incremental-X launcher
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.08;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="44" fill="#39ff14" opacity="0">[  OK  ] mount /lab               R&amp;D · prototypes · dry-run
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.12;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="66" fill="#00f0ff" opacity="0">[ INFO ] operator=Cursor_AI       qa=Mr-Aurevo-X
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.16;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="88" fill="#9dffc2" opacity="0">[ SYNC ] SoT inject ui-kit + security helpers
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.20;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="110" fill="#39ff14" opacity="0">[ EXEC ] WinCleaner traces --ship --human-signoff
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.24;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="132" fill="#00f0ff" opacity="0">[ BUILD ] DiskMap / FastFind / ColorPicker queued
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.28;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="154" fill="#6aff9a" opacity="0">[ LINK ] guns.lol/mr_aurevo_x     discord://user
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.32;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="176" fill="#9dffc2" opacity="0">[ LAB  ] IdentityReset dry-run on VM snapshot
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.36;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="198" fill="#39ff14" opacity="0">[  OK  ] telemetry cards refreshed (private)
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.40;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="220" fill="#9dffc2" opacity="0">[ DIFF ] +CURSOR_AI  architecture · code · ship
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.44;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="242" fill="#9dffc2" opacity="0">[ DIFF ] +HUMAN      ideas · break · QA · go/no-go
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.48;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="264" fill="#6aff9a" opacity="0">[ WAIT ] idle -- next idea from human layer...
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.52;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text x="40" y="286" fill="#00f0ff" opacity="0">mr-aurevo-x@workshop:~$ <tspan fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="17s" repeatCount="indefinite"/>_</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.56;0.94;1" dur="32s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <animateTransform attributeName="transform" type="translate" values="0 90;0 90;0 -200;0 -200;0 90" keyTimes="0;0.04;0.88;0.94;1" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="24" y="270" width="1052" height="2" fill="url(#g)" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="295" fill="#4d7a5c" font-family="Consolas, ui-monospace, monospace" font-size="11">mr-aurevo-x · workshop shell · AI-operated</text>
  <text x="820" y="295" fill="#39ff14" font-family="Consolas, ui-monospace, monospace" font-size="12">AI-RUN WORKSHOP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="900" height="180" rx="14" fill="#050807" stroke="#12352b"/>
  <text x="28" y="36" fill="#7dffc0" font-family="Consolas, Monaco, monospace" font-size="14">PROTOCOL // OWNERSHIP_MATRIX</text>

  <g font-family="Consolas, Monaco, monospace" font-size="16">
    <rect x="28" y="56" width="400" height="96" rx="10" fill="#071410" stroke="#39ff14"/>
    <text x="48" y="88" fill="#39ff14">CURSOR AI</text>
    <text x="48" y="114" fill="#b7ffe0">builds · refactors · ships</text>
    <text x="48" y="136" fill="#00f0ff">operates the workshop 24/7</text>

    <rect x="472" y="56" width="400" height="96" rx="10" fill="#071820" stroke="#00f0ff"/>
    <text x="492" y="88" fill="#00f0ff">MR-AUREVO-X</text>
    <text x="492" y="114" fill="#b7ffe0">ideas · product vision</text>
    <text x="492" y="136" fill="#39ff14">tests · QA · green light</text>
  </g>

  <rect x="420" y="90" width="60" height="6" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>

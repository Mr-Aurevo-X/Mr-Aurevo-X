<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mr-Aurevo-X AI-operated workshop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="45%" stop-color="#071410"/>
      <stop offset="100%" stop-color="#031018"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0c2a22" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.9"/>

    <!-- rain columns -->
    <g opacity="0.55" font-family="Consolas, Monaco, monospace" font-size="13" fill="#1dff8a">
      <text x="48" y="-20">
        <tspan id="c1">01??10CODE01??10</tspan>
        <animate attributeName="y" values="-40;360" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="160" y="-80" fill="#00e5ff">
        <tspan>CURSOR_AI_RUN</tspan>
        <animate attributeName="y" values="-100;380" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="290" y="-30">
        <tspan>BUILD·TEST·SHIP</tspan>
        <animate attributeName="y" values="-50;370" dur="6.5s" repeatCount="indefinite"/>
      </text>
      <text x="980" y="-60" fill="#00e5ff">
        <tspan>WORKSHOP_ONLINE</tspan>
        <animate attributeName="y" values="-80;390" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1100" y="-10">
        <tspan>0xAUREVO</tspan>
        <animate attributeName="y" values="-30;350" dur="5.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- scanline -->
    <rect x="0" width="1200" height="48" fill="url(#scan)">
      <animate attributeName="y" values="-48;320" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- left terminal panel -->
    <rect x="36" y="36" width="340" height="248" rx="12" fill="#06110d" stroke="#1dff8a" stroke-width="1.5" opacity="0.95"/>
    <circle cx="58" cy="58" r="5" fill="#ff5f56"/>
    <circle cx="76" cy="58" r="5" fill="#ffbd2e"/>
    <circle cx="94" cy="58" r="5" fill="#27c93f"/>
    <text x="118" y="63" fill="#7dffc0" font-family="Consolas, Monaco, monospace" font-size="13">root@atelier — AI_CORE</text>

    <g font-family="Consolas, Monaco, monospace" font-size="14">
      <text x="54" y="98" fill="#39ff14">$</text>
      <text x="72" y="98" fill="#dfffee">boot --operator cursor-ai</text>
      <text x="54" y="124" fill="#00f0ff">&gt; kernel: ONLINE</text>
      <text x="54" y="150" fill="#9affc7">&gt; mode: AI-OPERATED WORKSHOP</text>
      <text x="54" y="176" fill="#9affc7">&gt; human: ideas + QA only</text>
      <text x="54" y="202" fill="#39ff14">$</text>
      <text x="72" y="202" fill="#dfffee">
        ship --suite --cleaners
        <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
      <text x="54" y="236" fill="#7dffc0">[????????????] 93% autonomy</text>
      <text x="54" y="262" fill="#00f0ff">STATUS // CODE WRITES ITSELF</text>
    </g>

    <!-- main title -->
    <g filter="url(#glow)">
      <text x="430" y="120" fill="url(#neon)" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">
        Mr-Aurevo-X
      </text>
      <text x="430" y="168" fill="#00f0ff" font-family="Consolas, Monaco, monospace" font-size="26" font-weight="700">
        // AI-RUN WORKSHOP
      </text>
    </g>

    <text x="430" y="214" fill="#b7ffe0" font-family="Segoe UI, Arial, sans-serif" font-size="20">
      Cursor AI builds &amp; operates the code
    </text>
    <text x="430" y="244" fill="#7ad7ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      Human owns the ideas · tests · vision
    </text>

    <!-- floating chips -->
    <g font-family="Consolas, Monaco, monospace" font-size="13" filter="url(#glow)">
      <rect x="430" y="268" width="148" height="28" rx="8" fill="#08241b" stroke="#39ff14"/>
      <text x="448" y="287" fill="#39ff14">AI_BUILDS</text>
      <rect x="592" y="268" width="168" height="28" rx="8" fill="#071820" stroke="#00f0ff"/>
      <text x="610" y="287" fill="#00f0ff">HUMAN_QA</text>
      <rect x="774" y="268" width="180" height="28" rx="8" fill="#08241b" stroke="#39ff14"/>
      <text x="792" y="287" fill="#b7ffe0">SUITE_ONLINE</text>
    </g>

    <!-- right pulse ring -->
    <g transform="translate(1080,160)">
      <circle r="58" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8">
        <animate attributeName="r" values="42;70;42" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="#071410" stroke="#39ff14" stroke-width="2"/>
      <text x="-22" y="6" fill="#39ff14" font-family="Consolas, Monaco, monospace" font-size="16" font-weight="700">AI</text>
    </g>

    <rect x="2" y="2" width="1196" height="316" rx="16" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.85"/>
  </g>
</svg>

  <rect x="302" y="314" width="484" height="24" rx="4" fill="#030605" stroke="#1a3d2a"/>
  <g clip-path="url(#tickWin)" font-family="Consolas, monospace" font-size="12" fill="#39ff14">
    <text x="310" y="331">
      QrTools  |  UnitConvert  |  TimeTools  |  PixClean  |  QrTools  |
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-520 0" dur="22s" repeatCount="indefinite"/>
    </text>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Workshop factory floor crafted status board">
  <defs>
    <linearGradient id="floorBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030605"/>
      <stop offset="50%" stop-color="#050807"/>
      <stop offset="100%" stop-color="#030a0c"/>
    </linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#39ff14" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1100" height="460" fill="url(#floorBg)"/>
  <rect width="1100" height="460" fill="url(#grid)"/>
  <rect x="12" y="12" width="1076" height="436" rx="14" fill="#050807" stroke="url(#split)" stroke-width="2"/>


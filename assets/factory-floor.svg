  <text x="834" y="122" fill="#7ec8ff" font-family="Consolas, monospace" font-size="12">Hub-* Releases</text>
  <text x="834" y="144" fill="#00f0ff" font-family="Consolas, monospace" font-size="11">Launch-Hub-*.zip each remote</text>
  <text x="834" y="166" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">SoftTunes.zip | GameChangelog.zip</text>
  <text x="834" y="186" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">no central installer</text>
  <circle cx="1000" cy="130" r="5" fill="#00f0ff">

  <rect x="418" y="146" width="108" height="26" rx="4" fill="#071018" stroke="#00f0ff"/>
  <text x="442" y="163" fill="#00f0ff" font-family="Consolas, monospace" font-size="10">linux</text>
  <rect x="534" y="146" width="108" height="26" rx="4" fill="#071018" stroke="#00f0ff"/>
  <text x="548" y="163" fill="#00f0ff" font-family="Consolas, monospace" font-size="10">fakevps</text>

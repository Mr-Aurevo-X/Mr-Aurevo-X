  <rect x="302" y="346" width="484" height="24" rx="4" fill="#030605" stroke="#0a3a44"/>
  <g clip-path="url(#tickLin)" font-family="Consolas, monospace" font-size="12" fill="#00f0ff">
    <text x="310" y="363">
      Crypto Tracker  |  Gest Linux Pro  |  MrAurevoX Kit  |  native + Flatpak  |  Crypto Tracker  |
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-420 0" dur="18s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="302" y="388" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">rule: if it ships, AI wrote it -- Mr-Aurevo-X signed it off</text>
  <text x="302" y="404" fill="#4d7a5c" font-family="Consolas, monospace" font-size="11">SoT: Dev Central Tree | PC Command Hub-* public | vitrine binaries</text>

  <!-- RIGHT: ship channel + connect -->

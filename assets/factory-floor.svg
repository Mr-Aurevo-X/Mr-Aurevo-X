  <text x="834" y="274" fill="#6aff9a" font-family="Consolas, monospace" font-size="11">guns.lol</text>
  <text x="834" y="294" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">PayPal | Revolut</text>

  <rect x="834" y="330" width="210" height="36" rx="6" fill="#071018" stroke="#39ff14"/>
  <text x="848" y="352" fill="#39ff14" font-family="Consolas, monospace" font-size="11">FACTORY = ONLINE</text>
  <text x="834" y="390" fill="#4d7a5c" font-family="Consolas, monospace" font-size="10">WIN + LIN public</text>

  <!-- footer honesty -->

  <text x="662" y="163" fill="#00f0ff" font-family="Consolas, monospace" font-size="10">sentinel</text>

  <text x="302" y="184" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">ATELIER  | 4 hubs public | UAC | v2.0.0</text>
  <text x="302" y="200" fill="#6aff9a" font-family="Consolas, monospace" font-size="11">SALON    | Tauri v2 | 29 *-X on-demand</text>
  <text x="302" y="216" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">SOFTTUNES| v2.0.0 public | session</text>
  <text x="302" y="232" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">FAKEVPS  | 1.0.0 final | public src</text>
  <text x="302" y="248" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">SENTINEL | v2.0.0 | Apache-2.0</text>
  <text x="302" y="264" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">WIN      | 4 desktop .exe | free</text>
  <text x="302" y="280" fill="#7ec8ff" font-family="Consolas, monospace" font-size="11">LINUX    | Crypto Tracker | Gest | Kit</text>

  <line x1="302" y1="286" x2="786" y2="286" stroke="#0a3a44"/>
  <text x="302" y="306" fill="#39ff14" font-family="Consolas, monospace" font-size="12">WIN TICKER</text>
  <text x="520" y="306" fill="#00f0ff" font-family="Consolas, monospace" font-size="12">LIN TICKER</text>

